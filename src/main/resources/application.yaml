server:
  port: 8087

spring:
  application:
    name: demo

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

resilience4j:
  ratelimiter:
    configs:
      default:
        limit-for-period: 3
        limit-refresh-period: 1m
        timeout-duration: 0
    instances:
      createTaskRateLimiter:
        base-config: default

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.example.demo: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

management:
  server:
    port: 8087
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
